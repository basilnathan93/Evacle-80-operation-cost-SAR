<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Evacle 80 | Evacetic USD 55 Cost Calculator</title>
<style>:root{--navy:#16324f;--teal:#137d84;--muted:#63758a;--line:#e1e8ed}*{box-sizing:border-box}body{font-family:Arial,Helvetica,sans-serif;background:#f3f6f9;color:var(--navy);margin:0;padding:28px}.wrap{max-width:1100px;margin:auto}h1{margin:0 0 8px;font-size:30px}.sub{color:var(--muted);margin:0 0 25px}.section{background:white;border-radius:15px;padding:25px;margin:0 0 22px;box-shadow:0 2px 10px #0000000c}.section h2{margin:0 0 7px;font-size:23px}.price{font-size:13px;color:var(--muted);margin:0 0 23px}.control{padding:17px 20px;background:#f2f8f8;border:1px solid #d9ebeb;border-radius:10px;margin-bottom:20px}.control label{display:flex;justify-content:space-between;font-weight:bold;gap:10px}.control output{font-size:22px;color:var(--teal)}input[type=range]{width:100%;accent-color:var(--teal);cursor:pointer;margin:15px 0 2px}.range{display:flex;justify-content:space-between;color:var(--muted);font-size:12px}.cards{display:grid;grid-template-columns:1fr 1fr;gap:15px}.card{border:1px solid var(--line);border-radius:10px;padding:20px}.card h3{font-size:16px;margin:0 0 14px}.result{font-size:34px;font-weight:700;color:var(--teal)}.percycle{color:var(--muted);margin:5px 0 14px}table{width:100%;border-collapse:collapse;font-size:14px}td{padding:9px 0;border-bottom:1px solid var(--line)}td:last-child{text-align:right;font-weight:600}tr:last-child td{border-bottom:0;font-weight:bold}.foot{color:var(--muted);font-size:13px;line-height:1.6;margin:15px 2px 0}@media(max-width:720px){body{padding:14px}.cards{grid-template-columns:1fr}.section{padding:17px}h1{font-size:25px}}</style></head>
<body><main class="wrap"><h1>Evacle 80 — Treatment Cost Calculator</h1><p class="sub">Cost in Saudi Riyals.</p>
<section class="section"><h2>Operational Cost</h2><p class="price">300 mL Evacetic · 40 L water · 1 kWh electricity per cycle</p><div class="control"><label for="kg55"><span>Waste treated per cycle</span><output id="val55" for="kg55">5 kg</output></label><input type="range" id="kg55" min="3" max="12" step="0.5" value="5"><div class="range"><span>3 kg</span><span>12 kg</span></div></div><div class="cards" id="cards55"></div></section>

</main>
<script>
const cyclesYear=7488, rate=3.75;
function makeCard(price,kg,includeMaintenance){
 const ev=price*rate*(.3/10),water=.4,electricity=.18,kits=includeMaintenance?650*rate/cyclesYear:0,spares=includeMaintenance?10000*rate/2/cyclesYear:0;
 const total=ev+water+electricity+kits+spares;
 const rows=[['Evacetic (300 mL)',ev],['Water (40 L)',water],['Electricity (1 kWh)',electricity]];
 if(includeMaintenance)rows.push(['Testing kits',kits],['Spare parts',spares]);
 return `<article class="card"><h3>${includeMaintenance?'Including kits & spare parts':'Evacetic, water & electricity only'}</h3><div class="result">SAR ${(total/kg).toFixed(2)}/kg</div><div class="percycle">SAR ${total.toFixed(2)} per cycle · ${kg} kg/cycle</div><table>${rows.map(([name,value])=>`<tr><td>${name}</td><td>SAR ${value.toFixed(3)}</td></tr>`).join('')}<tr><td>Total per cycle</td><td>SAR ${total.toFixed(3)}</td></tr></table></article>`;
}
function update(price){const kg=Number(document.getElementById('kg'+price).value);document.getElementById('val'+price).textContent=kg+' kg';document.getElementById('cards'+price).innerHTML=makeCard(price,kg,false)+makeCard(price,kg,true)}
for(const price of [55]){document.getElementById('kg'+price).addEventListener('input',()=>update(price));update(price)}
</script></body></html>
